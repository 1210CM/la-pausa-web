<div id="cookie-banner" style="display:none">
    <p>Usamos cookies para mejorar tu experiencia. Al continuar navegando aceptás su uso.
        <a href="/privacidad/">Más información</a>
    </p>
    <button id="cookie-accept">Aceptar</button>
</div>

<script>
    (function() {
        if (!localStorage.getItem("cookies-accepted")) {
            document.getElementById("cookie-banner").style.display = "flex";
        }
        document.getElementById("cookie-accept").addEventListener("click", function() {
            localStorage.setItem("cookies-accepted", "true");
            document.getElementById("cookie-banner").style.display = "none";
        });
    })();
</script>

<script>
    (function() {
        var toggle = document.getElementById("theme-toggle-home");
        if (!toggle) return;
        toggle.addEventListener("click", function() {
            var html = document.querySelector("html");
            if (html.dataset.theme === "dark") {
                html.dataset.theme = "light";
                localStorage.setItem("pref-theme", "light");
            } else {
                html.dataset.theme = "dark";
                localStorage.setItem("pref-theme", "dark");
            }
        });
    })();
</script>
