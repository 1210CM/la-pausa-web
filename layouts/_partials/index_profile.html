<div class="home-masthead">
    <img class="home-masthead-img" src="/images/banner-texto.jpeg" alt="Claudio, conductor de La Pausa — Decidir es fácil, acertar no tanto" />
    <div class="home-masthead-overlay">
        <a href="{{ "" | absLangURL }}" class="home-masthead-title" accesskey="h" title="La Pausa (Alt + H)">La Pausa</a>
        {{- if (not site.Params.disableThemeToggle) }}
        <button id="theme-toggle-home" class="theme-toggle" accesskey="t" title="(Alt + T)" aria-label="Toggle theme">
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
        {{- end }}
    </div>
</div>

<p class="sr-only">Podcast para ayudarte a reflexionar. Decidir es fácil, acertar no tanto.</p>

<nav class="home-masthead-nav" aria-label="Navegación principal">
    <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL | absLangURL }}">{{ .Name }}</a></li>
        {{- end }}
    </ul>
</nav>

{{- with .Content }}
<div class="post-content home-content home-content--intro">
    {{- . | safeHTML }}
</div>
{{- end }}

<div class="post-content home-content">
    {{- partial "home_curated.html" . }}
</div>
