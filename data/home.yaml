# Home automático desde 2026-08-30 — normalmente este archivo NO se toca.
#
# El episodio destacado es el más reciente por fecha (content/episodios/*.md),
# y sus posts se arman solos: todo post de content/blog/ cuyo frontmatter
# tenga `episodio: <slug-del-episodio-destacado>`. "Anteriores" es todo lo
# demás, ordenado por fecha. Instrucciones completas:
# la-pausa-configuracion-ia/claude/habilidades/home-web-actualizar.md
#
# Override manual (excepcional): completar el slug de un episodio acá SOLO si
# hace falta forzar cuál se destaca — por ejemplo, si el episodio nuevo ya
# está publicado en el sitio pero todavía es la semana de promoción del
# anterior en redes, y no querés que el home salte antes de tiempo. Dejar
# vacío el resto del tiempo — es la excepción, no el uso normal.
episodio_destacado_override: ""
